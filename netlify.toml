# The site is now built with Astro. Netlify runs the build and publishes dist/.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.23.4"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# /resume used to build as /resume/. Send anyone with the old URL to the new one.
[[redirects]]
  from = "/resume/"
  to = "/resume"
  status = 301
